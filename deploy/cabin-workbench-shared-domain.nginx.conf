client_max_body_size 1m;

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# Keep the IP entry point available while using the canonical workbench app
# and database behind bobjennies.click/workbench.
location = / {
    proxy_pass https://bobjennies.click/workbench;
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_ssl_name bobjennies.click;
    proxy_set_header Host bobjennies.click;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_cookie_flags ~ nosecure;
    proxy_redirect https://bobjennies.click/workbench /workbench;
    proxy_connect_timeout 5;
    proxy_read_timeout 65;
    proxy_send_timeout 65;
}

location = /workbench {
    proxy_pass https://bobjennies.click/workbench;
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_ssl_name bobjennies.click;
    proxy_set_header Host bobjennies.click;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_cookie_flags ~ nosecure;
    proxy_redirect https://bobjennies.click/workbench /workbench;
    proxy_connect_timeout 5;
    proxy_read_timeout 65;
    proxy_send_timeout 65;
}

location ^~ /workbench/api/auth/ {
    limit_req zone=cabin_auth_limit burst=5 nodelay;
    proxy_pass https://bobjennies.click;
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_ssl_name bobjennies.click;
    proxy_set_header Host bobjennies.click;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_cookie_flags ~ nosecure;
    proxy_redirect https://bobjennies.click/workbench/ /workbench/;
    proxy_connect_timeout 5;
    proxy_read_timeout 65;
    proxy_send_timeout 65;
}

location ^~ /workbench/ {
    proxy_pass https://bobjennies.click;
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_ssl_name bobjennies.click;
    proxy_set_header Host bobjennies.click;
