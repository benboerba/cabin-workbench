    proxy_connect_timeout 5;
    proxy_read_timeout 65;
    proxy_send_timeout 65;
}

location /api/auth/ {
    limit_req zone=cabin_auth_limit burst=5 nodelay;
    proxy_pass https://bobjennies.click/workbench/api/auth/;
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_ssl_name bobjennies.click;
    proxy_set_header Host bobjennies.click;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_cookie_flags ~ nosecure;
    proxy_redirect https://bobjennies.click/workbench/ /workbench/;
    proxy_connect_timeout 5;
    proxy_read_timeout 65;
    proxy_send_timeout 65;
}

location / {
    proxy_pass https://bobjennies.click/workbench/;
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_ssl_name bobjennies.click;
    proxy_set_header Host bobjennies.click;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_cookie_flags ~ nosecure;
    proxy_redirect https://bobjennies.click/workbench/ /workbench/;
    proxy_connect_timeout 5;
    proxy_read_timeout 65;
    proxy_send_timeout 65;
}

gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_comp_level 5;
gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
