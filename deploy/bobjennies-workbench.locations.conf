# Insert these locations inside the existing bobjennies.click port-80 server.
# HTTPS is terminated by the existing TLS gateway before reaching Nginx.

location = /workbench {
    proxy_pass http://127.0.0.1:14270;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 5;
    proxy_read_timeout 65;
    proxy_send_timeout 65;
}

location ^~ /workbench/api/auth/ {
    limit_req zone=cabin_gateway_auth burst=5 nodelay;
    proxy_pass http://127.0.0.1:14270;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
}

location ^~ /workbench/ {
    proxy_pass http://127.0.0.1:14270;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 5;
    proxy_read_timeout 65;
    proxy_send_timeout 65;
}
