limit_req_zone $binary_remote_addr zone=cabin_gateway_auth:10m rate=10r/m;

server {
    listen 80;
    server_name 38-181-56-160.sslip.io;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
    }

    location / {
        return 308 https://$host:8443$request_uri;
    }
}

server {
    listen 8443 ssl http2;
    server_name 38-181-56-160.sslip.io;

    ssl_certificate /etc/nginx/ssl/cabin-workbench/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/cabin-workbench/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:cabin_tls:10m;
    ssl_session_timeout 1d;

    client_max_body_size 1m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location /api/auth/ {
        limit_req zone=cabin_gateway_auth burst=5 nodelay;
        proxy_pass http://127.0.0.1:14270;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:14270;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5;
        proxy_read_timeout 65;
        proxy_send_timeout 65;
    }
}
